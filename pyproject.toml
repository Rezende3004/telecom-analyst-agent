[project]
name = "telecom-analyst"
version = "0.1.0"
description = "Agente que responde perguntas sobre o mercado brasileiro de banda larga fixa com dados públicos."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pandera[polars]>=0.35.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
benchmark = [
    "pyspark>=4.3.0",
    "rapidfuzz>=3.14.6",
]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: precisa da stack do docker compose no ar (make up)"]
